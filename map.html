<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insider</title>
  <style>
    :root { --ink: #202020; --muted: #666; --line: #d8d8d8; --accent: #e84b2c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f7f6; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .page { width: min(100% - 40px, 980px); margin: 0 auto; padding: 56px 0 80px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.045em; line-height: 1.05; }
    .intro { margin: 10px 0 30px; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .search-label { display: block; margin-bottom: 9px; font: 11px/1.3 "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .search { width: 100%; height: 58px; padding: 0 18px; border: 1px solid #999; border-radius: 4px; background: #fff; color: var(--ink); font: 19px/1.3 Arial, Helvetica, sans-serif; outline-offset: 3px; }
    .search:focus { border-color: var(--accent); }
    .result-count { margin: 22px 0 14px; color: var(--muted); font: 12px/1.4 "SFMono-Regular", Menlo, Consolas, monospace; }
    .results { display: grid; gap: 16px; }
    .reel { display: grid; grid-template-columns: minmax(0, 1fr) 178px; gap: 22px; padding: 22px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
    .reel-copy { min-width: 0; }
    .reel-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; color: var(--muted); font: 11px/1.5 "SFMono-Regular", Menlo, Consolas, monospace; }
    .reel-caption { margin: 0; white-space: pre-line; overflow-wrap: anywhere; font-size: 15px; line-height: 1.5; }
    .reel-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; font-size: 13px; }
    .reel-footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--accent); }
    .reel-thumb { width: 100%; max-height: 220px; object-fit: cover; border-radius: 2px; background: #eee; }
    .empty { padding: 28px 0; color: var(--muted); font-size: 15px; }
    @media (max-width: 640px) { .page { width: min(100% - 32px, 980px); padding-top: 36px; } .reel { grid-template-columns: 1fr; padding: 18px; } .reel-thumb { order: -1; max-height: 240px; } .search { font-size: 16px; } }
  </style>
</head>
<body>
  <main class="page">
    <h1>Insider</h1>
    <p class="intro">What SF tech is talking about.</p>
    <label class="search-label" for="search">Search captions</label>
    <input class="search" id="search" type="search" placeholder="Try Dreamforce" autocomplete="off" />
    <p class="result-count" id="result-count" role="status">Loading Reels…</p>
    <div class="results" id="results"></div>
  </main>
  <script>
    const search = document.getElementById('search');
    const results = document.getElementById('results');
    const resultCount = document.getElementById('result-count');
    let reels = [];

    fetch('/public/data/sf-ai-pins.json')
      .then((response) => { if (!response.ok) throw new Error('Could not load Reels'); return response.json(); })
      .then((data) => {
        reels = data.pins.slice().sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt));
        render();
      })
      .catch(() => { resultCount.textContent = 'Could not load the Reel catalog.'; });

    search.addEventListener('input', render);

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      const matches = reels.filter((reel) => reel.caption.toLocaleLowerCase().includes(query));
      resultCount.textContent = `${matches.length} Reel${matches.length === 1 ? '' : 's'}${query ? ' matching your search' : ''}`;
      results.replaceChildren(...matches.map(reelCard));
      if (!matches.length) results.append(textElement('p', 'empty', 'No Reels match this search.'));
    }

    function reelCard(reel) {
      const card = textElement('article', 'reel');
      const copy = textElement('div', 'reel-copy');
      const meta = textElement('div', 'reel-meta');
      meta.append(textElement('span', '', formatDate(reel.publishedAt)));
      if (reel.location?.name) meta.append(textElement('span', '', reel.location.name));
      copy.append(meta, textElement('p', 'reel-caption', reel.caption));
      const footer = textElement('div', 'reel-footer');
      footer.append(link(`@${reel.username}`, `https://www.instagram.com/${encodeURIComponent(reel.username)}/`), link('View Reel ↗', reel.url));
      copy.append(footer);
      card.append(copy);
      if (reel.thumbnailUrl) {
        const image = document.createElement('img');
        image.className = 'reel-thumb';
        image.src = reel.thumbnailUrl;
        image.alt = `Thumbnail for Reel by @${reel.username}`;
        image.loading = 'lazy';
        card.append(image);
      }
      return card;
    }

    function textElement(tag, className, value = '') { const node = document.createElement(tag); node.className = className; node.textContent = value; return node; }
    function link(label, href) { const node = document.createElement('a'); node.href = href; node.target = '_blank'; node.rel = 'noreferrer'; node.textContent = label; return node; }
    function formatDate(value) { return new Date(value).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  </script>
</body>
</html>
